# Release: publishes the module to the PowerShell Gallery and creates the GitHub Release.
#
# Real release: push a tag v<ModuleVersion> (for example v0.5.0) that points at a commit on master.
# Dry run:      "Run workflow" (workflow_dispatch) on any branch. It checks, builds, tests and packages, and then
#               stops: nothing is published and no release is created.
#
# What a release does, in order:
#   1. check     tag = ModuleVersion in the manifest, CHANGELOG.md has a dated section for the version, the version
#                is not on the Gallery yet, and the tagged commit is on master (Build/Get-ReleaseInfo.ps1)
#   2. build     build and run every stage of Tests/test-local.ps1 (the same checks as CI, both PowerShell editions)
#   3. package   pack the build into a .nupkg, push it to a temporary folder repository and import the saved
#                package on both editions (Build/Test-ReleasePackage.ps1)
#   4. publish   Publish-PSResource -NupkgPath of that exact .nupkg, after checking its SHA256. Runs in the
#                "psgallery" environment, which holds the PSGALLERY_API_KEY secret and should require the owner's
#                approval. If the version is already on the Gallery (a re-run after the upload went through), it
#                uploads nothing and succeeds.
#   5. release   GitHub Release for the tag, with the CHANGELOG section as its notes, then a wait until the
#                Gallery lists the version (a warning, never a failure)
#
# A Gallery version can never be replaced, so everything that can fail is checked before step 4.
# Re-running: "Re-run failed jobs" is always safe. "Re-run all jobs" after a successful publish stops at step 1,
# because the version then exists. See "Releasing" in AGENTS.md.
# No module name is hard-coded here.
#
# Security note: never interpolate ${{ github.* }} values directly into a run: script. Use env: or the
# default GITHUB_* environment variables instead.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Dry runs and tag runs queue separately: a group keeps only one waiting run, so a dry run in the same group
# could cancel a waiting release.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, build and test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      # Passed to the publish job apart from the artifact, so the file and its expected hash do not travel together
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the release
        run: |
          $Params = @{ NotesPath = 'release-notes.md' }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
              $Params.Tag = $env:GITHUB_REF_NAME
              git merge-base --is-ancestor HEAD origin/master
              if ($LASTEXITCODE -ne 0) { throw "Tag $env:GITHUB_REF_NAME does not point at a commit on master." }
          } else {
              $Params.AllowUnreleased = $true
          }
          $Info = ./Build/Get-ReleaseInfo.ps1 @Params
          $Info | Select-Object ModuleName, Version, Tag, DryRun, NotesSource | Format-List

      - name: Build and test
        run: ./Tests/test-local.ps1

      - name: Package and check the package
        id: package
        run: |
          $Release = Join-Path 'output' 'release'
          $Package = ./Build/Test-ReleasePackage.ps1 -PackagePath $Release
          "sha256=$($Package.PackageSha256)" | Add-Content -Path $env:GITHUB_OUTPUT
          Move-Item -Path 'release-notes.md' -Destination $Release
          $Package | Select-Object ModuleName, Version, Functions, PackageName, PackageSha256 |
              ConvertTo-Json | Set-Content -Path (Join-Path $Release 'release.json')

          $Mode = if ($env:GITHUB_EVENT_NAME -eq 'push') { 'Release' } else { 'Dry run (nothing is published)' }
          @(
              "## $($Package.ModuleName) $($Package.Version)"
              ''
              "- Mode: $Mode"
              "- Commit: $env:GITHUB_SHA"
              "- Functions: $($Package.Functions)"
              "- Package: $($Package.PackageName), SHA256 $($Package.PackageSha256)"
              ''
              '### Release notes'
              ''
              (Get-Content -Path (Join-Path $Release 'release-notes.md') -Raw)
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload Release Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: output/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to the PowerShell Gallery
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    environment:
      name: psgallery
      url: https://www.powershellgallery.com/packages/${{ github.event.repository.name }}
    defaults:
      run:
        shell: pwsh

    steps:
      # No checkout: this job only handles the files the build job tested.
      - name: Download Release Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Publish
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'The PSGALLERY_API_KEY secret is not set in the psgallery environment.' }
          if (-not $env:EXPECTED_SHA256) { throw 'The build job reported no package hash.' }
          $Release = Get-Content -Path 'release/release.json' -Raw | ConvertFrom-Json
          if ("v$($Release.Version)" -ne $env:GITHUB_REF_NAME) {
              throw "The built version $($Release.Version) does not match tag $env:GITHUB_REF_NAME."
          }
          # Publish the .nupkg the build job checked: its hash must be the one that job reported
          $Package = Join-Path 'release' $Release.PackageName
          $Hash = (Get-FileHash -Path $Package -Algorithm SHA256).Hash
          if ($Hash -ne $env:EXPECTED_SHA256) {
              throw "The package hash $Hash does not match the checked package $env:EXPECTED_SHA256."
          }

          # Is the version already on the Gallery? 200 = yes, 404 = no, anything else = stop. It is there when
          # this job is re-run after an upload that went through (the build job refuses a version that exists
          # before it builds). Uploading again would only fail, so skip it and let the release be created.
          $Uri = "https://www.powershellgallery.com/api/v2/Packages(Id='$($Release.ModuleName)',Version='$($Release.Version)')"
          try {
              Invoke-WebRequest -Uri $Uri -UseBasicParsing | Out-Null
              $Exists = $true
          } catch {
              $Status = 0
              if ($_.Exception.Response) { $Status = [int]$_.Exception.Response.StatusCode }
              if ($Status -ne 404) { throw "Could not check the PowerShell Gallery (HTTP $Status): $($_.Exception.Message)" }
              $Exists = $false
          }
          $AlreadyThere = "Already on the Gallery: $($Release.ModuleName) $($Release.Version). Nothing was uploaded in this run."
          $IsRerun = [int]$env:GITHUB_RUN_ATTEMPT -gt 1
          if ($Exists) {
              # On the first attempt nothing in this run can have uploaded it, so it came from somewhere else
              # and is not the package this run tested
              if (-not $IsRerun) {
                  throw "$($Release.ModuleName) $($Release.Version) appeared on the PowerShell Gallery after the build job checked, and this run did not upload it."
              }
              Write-Warning $AlreadyThere
              $AlreadyThere | Add-Content -Path $env:GITHUB_STEP_SUMMARY
              exit 0
          }

          try {
              Publish-PSResource -NupkgPath $Package -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
          } catch {
              # A version the Gallery is still validating can answer 404 above; a re-run then gets a conflict
              # here, which means the earlier attempt's upload went through
              if ($IsRerun -and "$($_.Exception.Message)" -match '409|Conflict|already exists') {
                  Write-Warning "$AlreadyThere ($($_.Exception.Message))"
                  $AlreadyThere | Add-Content -Path $env:GITHUB_STEP_SUMMARY
                  exit 0
              }
              throw
          }
          Write-Host "Published $($Release.ModuleName) $($Release.Version) ($($Release.PackageName), SHA256 $Hash)"
          "Published $($Release.ModuleName) $($Release.Version), SHA256 $Hash" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  github-release:
    name: Create the GitHub Release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Safe to re-run: a published release is left as it is, and a draft for the tag is published with the notes
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "Release $GITHUB_REF_NAME already exists."
          elif [ "$draft" = "true" ]; then
            gh release edit "$GITHUB_REF_NAME" --verify-tag --draft=false --title "$GITHUB_REF_NAME" --notes-file release/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release/release-notes.md
          fi

      # Last, and never a failure: the upload succeeded, but the Gallery can take a while to validate and list it
      - name: Wait until the Gallery lists the version
        shell: pwsh
        run: |
          try {
              $Release = Get-Content -Path 'release/release.json' -Raw | ConvertFrom-Json
              foreach ($Attempt in 1..20) {
                  $Found = Find-PSResource -Name $Release.ModuleName -Version $Release.Version -Repository PSGallery `
                      -ErrorAction SilentlyContinue
                  if ($Found) { Write-Host "The Gallery lists $($Found.Name) $($Found.Version)"; exit 0 }
                  Start-Sleep -Seconds 30
              }
              Write-Warning 'The Gallery does not list the version yet. Check the package page before announcing it.'
          } catch {
              Write-Warning "Could not ask the Gallery for the version: $($_.Exception.Message)"
          }
          exit 0
