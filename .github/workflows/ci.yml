# GitHub Actions CI for ConnectWiseControlAPI (replaces AppVeyor)
#
# Every job calls Tests/test-local.ps1 for one stage, so `./Tests/test-local.ps1` locally runs the same checks.
# The build job (Sampler/ModuleBuilder) produces output/<ModuleName>/<version>/; the Pester jobs test that built
# module under both Windows PowerShell 5.1 and PowerShell 7, because the module must work on both.
#
# Tools (Pester, PSScriptAnalyzer, platyPS and the build modules) are downloaded from the PowerShell Gallery once,
# by the build job, at the exact versions in RequiredModules.psd1. The other jobs get that folder as an artifact,
# and test-local.ps1 imports each tool at its pinned version. No job installs a tool by itself.
#
# Publishing to the PowerShell Gallery is done by release.yml (see AGENTS.md). No module name is hard-coded here.
#
# Security note: never interpolate ${{ github.* }} / ${{ matrix.* }} values directly into a
# run: script. Pass them through env: instead.

name: CI

# Branches are covered by their pull request; listing them under push too would run every job twice.
# Use "Run workflow" (workflow_dispatch) to test a branch that has no PR yet.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Other runs get a group of their own (the commit), so a
# run on master is never cancelled or replaced while it waits, and every merged commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build module
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: ./Tests/test-local.ps1 -Stage Build, Manifest

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-build
          path: |
            output/
            !output/RequiredModules/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Required Modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-modules
          path: output/RequiredModules/
          if-no-files-found: error
          retention-days: 7   # as long as module-build: a job re-run later still needs it

  test:
    name: Pester (${{ matrix.name }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: pwsh
            name: PowerShell 7
          - shell: powershell
            name: Windows PowerShell 5.1
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Build Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module-build
          path: output

      - name: Download Required Modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: required-modules
          path: output/RequiredModules

      - name: Run Pester against the built module
        env:
          RESULT_NAME: ${{ matrix.shell }}
        run: |
          ./Tests/test-local.ps1 -Stage Test -SkipWindowsPowerShell -TestResultPath "testResults-$env:RESULT_NAME.xml"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.shell }}
          path: testResults-*.xml
          retention-days: 30

  analyze:
    name: PSScriptAnalyzer
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Required Modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: required-modules
          path: output/RequiredModules

      - name: Analyze source
        run: ./Tests/test-local.ps1 -Stage Analyze

  docs:
    name: Docs drift
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Required Modules
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: required-modules
          path: output/RequiredModules

      - name: Regenerate help and check for drift
        run: ./Tests/test-local.ps1 -Stage Docs
