# Keeps the SHA-pinned GitHub Actions in .github/workflows current.
# Dependabot updates both the commit SHA and the trailing "# vX.Y.Z" comment.
#
# PowerShell Gallery modules are NOT covered by Dependabot. The build, test and docs tools are pinned to
# exact versions in RequiredModules.psd1; raise them there by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases settle for a week before proposing them
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
